[project]
name = "cpt-anywidget"
version = "0.2.0"
description = "anywidget viewers for CPT soundings and geotechnical boreholes"
readme = "README.md"
authors = [{ name = "Jules Blom @ Bedrock Technologies B.V." }]
license = "Apache-2.0"
license-files = ["LICENSE"]
keywords = [
    "cpt",
    "cone-penetration-test",
    "borehole",
    "geotechnics",
    "geotechnical",
    "sounding",
    "anywidget",
    "jupyter",
    "marimo",
    "visualization",
    "d3",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: Jupyter",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Visualization",
]
requires-python = ">=3.10"
dependencies = [
    "anywidget>=0.9",
]

[project.urls]
Documentation = "https://bedrock.engineer/docs/cpt-anywidget"
Repository = "https://github.com/bedrock-engineer/cpt-anywidget"

[dependency-groups]
dev = [
    "anywidget[dev]>=0.11.0",
    "brodata>=0.1.8",
    "d-geolib-plus",
    "marimo>=0.24",
    "pygef>=0.14.1; python_version >= '3.11'",
    "pytest>=8",
    "python-ags4>=1.2.0",
]
jupyter = [
    "jupyterlab>=4.6.2",
]

# uv installs this repo as a path dependency in sandboxed notebooks and
# caches the built wheel; without these keys a JS rebuild (which only
# touches static/) never invalidates that cache and stale bundles survive
# kernel restarts
[tool.uv]
cache-keys = [
    { file = "pyproject.toml" },
    { file = "src/cpt_anywidget/**/*.py" },
    { file = "src/cpt_anywidget/static/*.js" },
    { file = "src/cpt_anywidget/*.css" },
]

[tool.uv.sources]
d-geolib-plus = { git = "https://github.com/Deltares/GEOLib-Plus" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cpt_anywidget"]

[tool.hatch.build.targets.sdist]
exclude = [
    "/.claude",
    "/CLAUDE.md",
    "/CONTEXT.md",
    "/DEMO_IDEA.md",
    "/TODO.md",
    "**/.ipynb_checkpoints",
]
