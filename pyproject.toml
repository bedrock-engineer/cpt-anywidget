[project]
name = "cpt-anywidget"
version = "0.2.6"
description = "anywidget viewers for CPT soundings and geotechnical boreholes (BRO)"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "anywidget>=0.9",
]

[project.optional-dependencies]
# layers_from_bhrgt reads brodata's BHR-GT objects; the viewers themselves
# don't need it
bro = ["brodata>=0.1.8"]

[dependency-groups]
dev = [
    "anywidget[dev]>=0.11.0",
    "brodata>=0.1.8",
    "marimo>=0.23.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cpt_anywidget"]
